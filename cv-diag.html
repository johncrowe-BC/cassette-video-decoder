<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cassette Video – input check</title>
<style>
	body { background: #111; color: #ddd; font: 14px/1.5 -apple-system, Helvetica, sans-serif; margin: 24px; max-width: 820px; }
	h1 { font-size: 18px; margin: 0 0 4px; }
	p.sub { margin: 0 0 16px; color: #999; }
	button, select { font-size: 14px; padding: 6px 10px; margin-right: 8px; }
	.row { margin: 10px 0; }
	.ok { color: #6c6; }
	.bad { color: #f66; }
	.warn { color: #fc6; }
	.meter { position: relative; height: 24px; background: #222; border: 1px solid #444; margin: 4px 0 12px; }
	.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #3a3; }
	.meter .label { position: absolute; left: 8px; top: 2px; font-size: 12px; color: #fff; }
	#verdict { font-size: 15px; font-weight: 600; margin: 14px 0; }
	#log { background: #000; padding: 10px; border: 1px solid #333; font: 12px/1.5 Menlo, monospace; min-height: 120px; }
	#log div { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Cassette Video decoder: input check</h1>
<p class="sub">Makes the same microphone request the decoder makes, and shows what actually arrives.</p>

<div class="row">
	<button id="start">Start test</button>
	<select id="dev" disabled><option>(inputs appear after Start)</option></select>
	<button id="use" disabled>Use this input</button>
</div>

<div>Left channel (brightness)</div>
<div class="meter"><div class="fill" id="fillL"></div><div class="label" id="lblL">–</div></div>
<div>Right channel (color)</div>
<div class="meter"><div class="fill" id="fillR"></div><div class="label" id="lblR">–</div></div>

<div id="verdict"></div>
<div id="log"></div>

<script>
"use strict";

// The exact audio settings cv.js asks for.
const DECODER_CONSTRAINTS = {
	echoCancellation: false,
	noiseSuppression: false,
	autoGainControl: false,
	channelCount: { exact: 2 }
};

const PROBE_CODE = `
class CVProbe extends AudioWorkletProcessor {
	constructor() { super(); this.n = 0; }
	process( inputs ) {
		if( ( this.n++ % 50 ) === 0 ) this.port.postMessage( inputs[ 0 ].length );
		return true;
	}
}
registerProcessor( 'cv-probe', CVProbe );
`;

const logEl = document.getElementById( "log" );
const verdictEl = document.getElementById( "verdict" );

function log( msg, cls )
{
	const d = document.createElement( "div" );
	if( cls ) d.className = cls;
	d.textContent = msg;
	logEl.appendChild( d );
}

let ctx = null;
let stream = null;
let source = null;
let probeNode = null;
let probeLoaded = false;
let workletChecked = false;
let analyserL = null, analyserR = null;
let rafId = null;
let channelsAtDecoder = null;
let usingDecoderSettings = false;
const hold = { L: { min: 0, max: 0 }, R: { min: 0, max: 0 } };

log( "Page address: " + location.href );
log( "Secure page (needed for mic access): " + ( window.isSecureContext ? "yes" : "NO" ), window.isSecureContext ? "ok" : "bad" );
if( location.protocol === "file:" )
	log( "→ Opened from disk. Serve the folder with  python3 -m http.server 8000  and use http://localhost:8000", "bad" );
log( "Browser: " + navigator.userAgent );

async function listInputs( selectedId )
{
	const inputs = ( await navigator.mediaDevices.enumerateDevices() ).filter( d => d.kind === "audioinput" );
	const sel = document.getElementById( "dev" );
	sel.innerHTML = "";
	for( const d of inputs )
	{
		const o = document.createElement( "option" );
		o.value = d.deviceId;
		o.textContent = d.label || "(unnamed input)";
		if( d.deviceId === selectedId ) o.selected = true;
		sel.appendChild( o );
	}
	sel.disabled = false;
	document.getElementById( "use" ).disabled = false;
}

async function openInput( deviceId )
{
	if( rafId ) cancelAnimationFrame( rafId );
	if( source ) source.disconnect();
	if( stream ) stream.getTracks().forEach( t => t.stop() );
	channelsAtDecoder = null;
	hold.L = { min: 0, max: 0 };
	hold.R = { min: 0, max: 0 };

	const want = Object.assign( {}, DECODER_CONSTRAINTS );
	if( deviceId ) want.deviceId = { exact: deviceId };

	usingDecoderSettings = false;
	try
	{
		stream = await navigator.mediaDevices.getUserMedia( { audio: want } );
		usingDecoderSettings = true;
		log( "Mic request with the decoder's settings (stereo required): OK", "ok" );
	}
	catch( e )
	{
		log( "Mic request with the decoder's settings FAILED: " + e.name + ( e.constraint ? " (" + e.constraint + ")" : "" ) + " – " + e.message, "bad" );
		if( e.name === "OverconstrainedError" )
			log( "→ The browser can't get 2 channels from this input. The decoder stays black with it.", "bad" );
		if( e.name === "NotAllowedError" )
			log( "→ Mic blocked. Check the mic icon in the address bar, and System Settings → Privacy & Security → Microphone.", "bad" );

		const fallback = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
		if( deviceId ) fallback.deviceId = { exact: deviceId };
		try
		{
			stream = await navigator.mediaDevices.getUserMedia( { audio: fallback } );
			log( "Retried without the stereo requirement so you can see the input anyway.", "warn" );
		}
		catch( e2 )
		{
			log( "Retry failed too: " + e2.name + " – " + e2.message, "bad" );
			verdictEl.className = "bad";
			verdictEl.textContent = "The browser can't open any microphone input. Fix the permission first.";
			return;
		}
	}

	const track = stream.getAudioTracks()[ 0 ];
	const s = track.getSettings ? track.getSettings() : {};
	log( "Input in use: " + track.label );
	log( "Reported channels: " + ( s.channelCount ?? "not reported" ) +
		" | input sample rate: " + ( s.sampleRate ?? "not reported" ) +
		" | browser audio rate: " + ctx.sampleRate );
	log( "Browser processing – auto gain: " + s.autoGainControl + ", noise suppression: " + s.noiseSuppression + ", echo cancel: " + s.echoCancellation );
	if( s.sampleRate && s.sampleRate !== ctx.sampleRate )
		log( "→ Sample rates differ. Chrome converts this automatically; Firefox may refuse.", "warn" );

	await listInputs( s.deviceId );

	try
	{
		source = ctx.createMediaStreamSource( stream );
	}
	catch( e )
	{
		log( "Couldn't connect the input to the audio engine: " + e.name + " – " + e.message, "bad" );
		return;
	}

	// Same channel check the decoder does (inputs[0].length must be 2).
	if( probeLoaded )
	{
		probeNode = new AudioWorkletNode( ctx, "cv-probe", { numberOfInputs: 1, numberOfOutputs: 0 } );
		probeNode.port.onmessage = ev => { channelsAtDecoder = ev.data; };
		source.connect( probeNode );
	}

	const splitter = ctx.createChannelSplitter( 2 );
	analyserL = ctx.createAnalyser();
	analyserR = ctx.createAnalyser();
	analyserL.fftSize = analyserR.fftSize = 2048;
	source.connect( splitter );
	splitter.connect( analyserL, 0 );
	splitter.connect( analyserR, 1 );

	rafId = requestAnimationFrame( update );
}

function measure( analyser, h, buf )
{
	analyser.getFloatTimeDomainData( buf );
	let mn = 0, mx = 0;
	for( let i = 0; i < buf.length; i++ )
	{
		if( buf[ i ] < mn ) mn = buf[ i ];
		if( buf[ i ] > mx ) mx = buf[ i ];
	}
	// Slow-decay hold, roughly like the decoder's own peak tracking.
	h.min = Math.min( mn, h.min * 0.97 );
	h.max = Math.max( mx, h.max * 0.97 );
	const peak = Math.max( Math.abs( h.min ), Math.abs( h.max ) );
	return { peak, span: h.max - h.min };
}

function showMeter( which, m )
{
	const db = m.peak > 0 ? 20 * Math.log10( m.peak ) : -Infinity;
	const pct = Math.max( 0, Math.min( 100, ( db + 60 ) / 60 * 100 ) );
	const fill = document.getElementById( "fill" + which );
	fill.style.width = pct + "%";
	fill.style.background = m.peak >= 0.99 ? "#c33" : ( m.span > 0.1 ? "#3a3" : "#996" );
	document.getElementById( "lbl" + which ).textContent =
		( isFinite( db ) ? db.toFixed( 1 ) + " dBFS peak" : "silence" ) +
		" · span " + m.span.toFixed( 3 ) +
		( m.peak >= 0.99 ? " · CLIPPING" : "" );
}

const bufL = new Float32Array( 2048 );
const bufR = new Float32Array( 2048 );

function update()
{
	const L = measure( analyserL, hold.L, bufL );
	const R = measure( analyserR, hold.R, bufR );
	showMeter( "L", L );
	showMeter( "R", R );

	let text, cls;
	if( ctx.state !== "running" )
	{
		text = "Audio engine is " + ctx.state + ". Click Start test again.";
		cls = "warn";
	}
	else if( !usingDecoderSettings )
	{
		text = "This input fails the decoder's stereo requirement, so the decoder will stay black. Pick a 2-channel input (Zoom in stereo interface mode).";
		cls = "bad";
	}
	else if( channelsAtDecoder !== null && channelsAtDecoder !== 2 )
	{
		text = "Only " + channelsAtDecoder + " channel(s) reach the decoder; it ignores anything but 2, so it stays black.";
		cls = "bad";
	}
	else if( L.peak < 0.001 && R.peak < 0.001 )
	{
		text = "Stereo input is open but it's silent. Nothing is reaching the browser. Check the Zoom's routing and levels.";
		cls = "warn";
	}
	else if( L.span > 0.1 && R.span > 0.1 )
	{
		text = "Looks good: stereo, running, and strong enough for the decoder to look for sync. The decoder page should draw.";
		cls = "ok";
	}
	else
	{
		text = "Signal is arriving but weak. The decoder will draw, but won't look for sync until both channels swing past ±0.05 (about −26 dBFS).";
		cls = "warn";
	}
	if( cls === "ok" && ( L.peak >= 0.99 || R.peak >= 0.99 ) )
	{
		text += " But the input is clipping, so turn the Zoom's gain down a little.";
		cls = "warn";
	}
	verdictEl.className = cls;
	verdictEl.textContent = text +
		( channelsAtDecoder !== null ? "  [channels reaching decoder: " + channelsAtDecoder + "]" : "" );

	rafId = requestAnimationFrame( update );
}

document.getElementById( "start" ).addEventListener( "click", async () =>
{
	try
	{
		if( !ctx ) ctx = new AudioContext();
		await ctx.resume();
		log( "Audio engine: " + ctx.state + " at " + ctx.sampleRate + " Hz", ctx.state === "running" ? "ok" : "warn" );

		if( !probeLoaded )
		{
			try
			{
				const url = URL.createObjectURL( new Blob( [ PROBE_CODE ], { type: "application/javascript" } ) );
				await ctx.audioWorklet.addModule( url );
				probeLoaded = true;
			}
			catch( e )
			{
				log( "Couldn't load the channel probe: " + e.name + " – " + e.message, "warn" );
			}
		}

		if( !workletChecked )
		{
			workletChecked = true;
			try
			{
				await ctx.audioWorklet.addModule( "cv-decoder-color.js" );
				log( "Decoder's processing file (cv-decoder-color.js) loads: OK", "ok" );
			}
			catch( e )
			{
				log( "Couldn't load cv-decoder-color.js: " + e.name + " – " + e.message, "bad" );
				log( "→ Put this test file in the same folder as index.html and open it through http://localhost:8000", "bad" );
			}
		}

		await openInput( null );
	}
	catch( e )
	{
		log( "Start failed: " + e.name + " – " + e.message, "bad" );
	}
} );

document.getElementById( "use" ).addEventListener( "click", () =>
{
	const id = document.getElementById( "dev" ).value;
	log( "— Switching input —" );
	openInput( id );
} );
</script>
</body>
</html>
